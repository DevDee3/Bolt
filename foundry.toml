[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc           = "0.8.24"
optimizer      = true
optimizer_runs = 200
evm_version    = "paris"

[profile.default.fuzz]
runs             = 256
max_test_rejects = 65536

[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC}"
bsc_mainnet = "${BSC_MAINNET_RPC}"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api", chain = 97 }
bsc_mainnet = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api",         chain = 56 }
